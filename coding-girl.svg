<svg width="100%" viewBox="0 0 680 420" xmlns="http://www.w3.org/2000/svg" role="img"><title>Animated illustration of a girl in a black hoodie coding at a laptop</title><desc>A cute flat-style illustration of a girl wearing a black hoodie, glasses, and headphones, typing at a laptop with an animated glowing screen and blinking code cursor</desc>
<style>
@keyframes typeBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
@keyframes blink{0%,45%{opacity:1}50%,95%{opacity:0}100%{opacity:1}}
@keyframes sway{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes glow{0%,100%{opacity:.55}50%{opacity:.9}}
.hand-l{animation:typeBounce 0.6s ease-in-out infinite}
.hand-r{animation:typeBounce 0.6s ease-in-out infinite .3s}
.cursor{animation:blink 1.1s step-end infinite}
.head{transform-origin:340px 190px;animation:sway 4s ease-in-out infinite}
.spark1{animation:float 2.6s ease-in-out infinite}
.spark2{animation:float 3s ease-in-out infinite .5s}
.spark3{animation:float 2.2s ease-in-out infinite 1s}
.screenglow{animation:glow 2.4s ease-in-out infinite}
</style>
